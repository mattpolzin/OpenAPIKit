name: Code Coverage

on:
  pull_request:

jobs:
  codecov:
    container: 
      image: swift:6.4
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - run: swift test --enable-code-coverage
    - id: analysis
      uses: mattpolzin/swift-codecov-action@0.7.5
      with:
        MINIMUM_COVERAGE: 98
        INCLUDE_TESTS: 'true'
